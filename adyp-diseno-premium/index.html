<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ADYP - App Móvil & Tablet Design System & Prototipo Premium</title>
  <style>
    /* RESET & NATIVE BASE */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar, *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      font-family: var(--font-system);
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* THEME A: Clean Minimalist & Glassmorphism Fluid (iOS HIG) */
    body.concept-a {
      --bg-app: #020617;
      --bg-surface: rgba(15, 23, 42, 0.75);
      --bg-card: rgba(30, 41, 59, 0.6);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-text: #ffffff;
      --radius-card: 20px;
      --radius-btn: 14px;
      --blur-val: blur(20px);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    /* THEME B: Vibrant Premium Community (Material 3) */
    body.concept-b {
      --bg-app: #0b1329;
      --bg-surface: #1e293b;
      --bg-card: #273549;
      --border-color: rgba(245, 158, 11, 0.25);
      --text-main: #fffbeb;
      --text-sub: #cbd5e1;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-text: #020617;
      --radius-card: 28px;
      --radius-btn: 20px;
      --blur-val: none;
      --font-family: var(--font-system);
    }

    /* THEME C: Modern Warmth & Neo-Editorial */
    body.concept-c {
      --bg-app: #f7f4ed;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --border-color: #e2dcd2;
      --text-main: #1c1917;
      --text-sub: #57534e;
      --accent: #991b1b;
      --accent-hover: #7f1d1d;
      --accent-text: #ffffff;
      --radius-card: 14px;
      --radius-btn: 10px;
      --blur-val: none;
      --font-family: Georgia, Cambria, "Times New Roman", serif;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-family);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* TOP CONTROLS BAR */
    .top-controls {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f43f5e, #f59e0b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
    }
    .theme-segmented {
      display: flex;
      background: rgba(0,0,0,0.3);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .theme-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* APP CONTAINER & FRAMES */
    .main-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 12px;
      max-width: 100%;
    }
    .device-mobile {
      width: 100%;
      max-width: 420px;
      min-height: 840px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .mobile-notch {
      padding: 8px 16px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0,0,0,0.2);
    }
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 90px;
    }

    /* BOTTOM NAV (Fixed & Compact iOS Bar) */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: var(--safe-bottom);
      z-index: 40;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 48px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      gap: 2px;
      transition: all 0.15s;
    }
    .nav-btn:active {
      transform: scale(0.92);
    }
    .nav-btn.active {
      color: var(--accent);
      font-weight: 800;
    }

    /* CARD STYLING */
    .meetup-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      overflow: hidden;
      margin-bottom: 14px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .meetup-card:active {
      transform: scale(0.98);
    }
    .card-img-wrap {
      position: relative;
      height: 140px;
      overflow: hidden;
      background: #000;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-primary {
      width: 100%;
      height: 32px;
      min-height: 32px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 6px;
      transition: all 0.15s;
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      color: var(--text-main);
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:active {
      transform: scale(0.97);
    }

    /* TOAST */
    .toast-popup {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .toast-popup.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(10px);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
    }

    /* MAP SVG */
    .map-container {
      width: 100%;
      height: 380px;
      background: #0b1120;
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .map-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }
    .map-pin:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }
    .pin-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f43f5e;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 10px rgba(244,63,94,0.5);
    }
  </style>
</head>
<body class="concept-a">

  <!-- TOP APP CONTROLS -->
  <header class="top-controls">
    <div class="brand-cluster" onclick="navigate('/')">
      <div class="brand-logo">AD</div>
      <strong style="color:var(--text-main);">ADYP</strong>
    </div>

    <!-- CONCEPTO A / B / C SWITCHER -->
    <div class="theme-segmented">
      <button class="theme-btn active" id="btn-conc-a" onclick="setConcept('a')">A: iOS Glass</button>
      <button class="theme-btn" id="btn-conc-b" onclick="setConcept('b')">B: Vibrant M3</button>
      <button class="theme-btn" id="btn-conc-c" onclick="setConcept('c')">C: Editorial</button>
    </div>

    <!-- ROLE SWITCHER -->
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="color:var(--text-sub); font-size:11px;">Rol:</span>
      <select id="role-select" onchange="setRole(this.value)" style="background:rgba(0,0,0,0.4); color:#fff; border:1px solid var(--border-color); padding:4px 8px; border-radius:8px; font-size:11px;">
        <option value="socio">Socio</option>
        <option value="invitado">Invitado</option>
        <option value="moderador">Moderador</option>
        <option value="admin">Administrador</option>
      </select>
    </div>

    <!-- QUICK AUDIT & PROMPT -->
    <div style="display:flex; gap:6px;">
      <button class="btn-secondary" onclick="navigate('/auditoria')" style="padding:4px 8px; font-size:11px;">Auditoría</button>
      <button class="btn-secondary" onclick="navigate('/prompt')" style="padding:4px 8px; font-size:11px; color:#f43f5e;">Prompt</button>
    </div>
  </header>

  <!-- MAIN VIEWPORT PHONE FRAME -->
  <main class="main-viewport">
    <div class="device-mobile" id="mobile-frame">
      <!-- Status Notch -->
      <div class="mobile-notch">
        <span>09:41</span>
        <span style="color:var(--accent);">● ADYP Live</span>
        <span>5G 100%</span>
      </div>

      <!-- Native Mobile App Header with Campanita & User Menu -->
      <div style="padding: 8px 12px; background: rgba(15,23,42,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;">
        <div onclick="navigate('/')" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <div style="width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #f43f5e, #6366f1); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; color: #fff;">AD</div>
          <div>
            <span style="font-size: 13px; font-weight: 900; color: #fff; line-height: 1;">ADYP</span>
            <span style="font-size: 8px; color: #f43f5e; font-weight: bold; display: block;">A Disfrutar y Punto</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <!-- Campanita con Badge -->
          <button onclick="showToast('3 Notificaciones: Nueva quedada en Sierra, comentario de Laura, confirmación plaza')" style="width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;" title="Notificaciones">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span style="position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; border-radius: 9px; background: #f43f5e; color: #fff; font-size: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center;">3</span>
          </button>
          <!-- User Menu Avatar -->
          <div onclick="showToast('Socio: Laura Gómez · Cuota 2026 al corriente ✓')" style="display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 9px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); cursor: pointer;" title="Menú de Socio">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=80&q=80" style="width: 22px; height: 22px; border-radius: 6px; object-fit: cover;">
            <span style="width: 5px; height: 5px; border-radius: 50%; background: #10b981;"></span>
          </div>
        </div>
      </div>

      <!-- Scrollable SPA Content -->
      <div class="screen-content" id="app-router-view">
        <!-- Dynamic views injected here -->
      </div>

      <!-- Bottom Navigation Bar (Fixed, Compact & Simple, No Big + Button) -->
      <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-home" onclick="navigate('/')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          <span>Explorar</span>
        </button>
        <button class="nav-btn" id="nav-agenda" onclick="navigate('/agenda')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Agenda</span>
        </button>
        <button class="nav-btn" id="nav-mapa" onclick="navigate('/mapa')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
          <span>Mapa</span>
        </button>
        <button class="nav-btn" id="nav-mis" onclick="navigate('/mis')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <span>Mis Planes</span>
        </button>
        <button class="nav-btn" id="nav-perfil" onclick="showToast('Perfil de Socio: Laura Gómez · Socio Activo')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil</span>
        </button>
      </nav>
    </div>
  </main>

  <!-- CREATE MEETUP MODAL -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-box">
      <!-- iOS Tactile Drag Handle -->
      <div style="width:40px; height:4px; background:rgba(255,255,255,0.3); border-radius:999px; margin:0 auto 10px;"></div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:16px; font-weight:800; color:#fff;">Proponer Quedada</h3>
        <button onclick="closeCreateModal()" style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <form onsubmit="handleCreate(event)" style="display:flex; flex-direction:column; gap:10px;">
        <input type="text" id="m-title" placeholder="Título de la quedada" required style="width:100%; padding:10px; border-radius:10px; background:#020617; border:1px solid #334155; color:#fff; font-size:12px;">
        <select id="m-category" style="width:100%; padding:10px; border-radius:10px; background:#020617; border:1px solid #334155; color:#fff; font-size:12px;">
          <option value="senderismo">Senderismo</option>
          <option value="gastronomia">Gastronomía</option>
          <option value="cultura">Cultura</option>
          <option value="nocturno">Tardeo & Nocturno</option>
        </select>
        <input type="text" id="m-date" value="Próximo Sábado, 11:00 h" style="width:100%; padding:10px; border-radius:10px; background:#020617; border:1px solid #334155; color:#fff; font-size:12px;">
        <input type="text" id="m-loc" placeholder="Punto de encuentro (Madrid)" required style="width:100%; padding:10px; border-radius:10px; background:#020617; border:1px solid #334155; color:#fff; font-size:12px;">
        <textarea id="m-desc" placeholder="Descripción del plan..." rows="3" style="width:100%; padding:10px; border-radius:10px; background:#020617; border:1px solid #334155; color:#fff; font-size:12px;"></textarea>
        <button type="submit" class="btn-primary">Publicar Quedada</button>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-popup" id="toast">Notificación</div>

  <!-- JAVASCRIPT INLINE SPA ROUTER & MOCK STATE -->
  <script>
    // MOCK DATA IN-MEMORY
    const MEETUPS = [
      {
        id: 'm-1',
        title: 'Ruta Laguna de Peñalara & Puesta de Sol',
        category: 'senderismo',
        date: 'Sábado, 24 Octubre · 09:30 h',
        location: 'Puerto de Cotos, Rascafría',
        price: 'Gratis',
        max: 18,
        current: 15,
        image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80',
        coords: { x: 42, y: 32 },
        desc: 'Recorrido por el Parque Nacional de Guadarrama disfrutando de la naturaleza y culminando con el atardecer.'
      },
      {
        id: 'm-2',
        title: 'Cata de Vinos & Tapas en La Latina',
        category: 'gastronomia',
        date: 'Viernes, 23 Octubre · 20:00 h',
        location: 'Cava Baja 14, La Latina',
        price: '24 €',
        max: 14,
        current: 14,
        image: 'https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=600&q=80',
        coords: { x: 50, y: 52 },
        desc: 'Degustación de 4 vinos maridados con quesos y tostas en bodega histórica de Madrid.'
      },
      {
        id: 'm-3',
        title: 'Misterios y Leyendas del Madrid Antiguo',
        category: 'cultura',
        date: 'Domingo, 25 Octubre · 19:45 h',
        location: 'Plaza de Oriente, Madrid',
        price: '10 €',
        max: 20,
        current: 9,
        image: 'https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=600&q=80',
        coords: { x: 47, y: 48 },
        desc: 'Paseo guiado nocturno por los Austrias conociendo historias secretas y crímenes históricos.'
      }
    ];

    let attending = ['m-1'];
    let currentRole = 'socio';
    let currentPath = '/';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      setTimeout(() => t.classList.remove('visible'), 3200);
    }

    function setConcept(c) {
      document.body.className = 'concept-' + c;
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-conc-' + c).classList.add('active');
      showToast('Concepto visual aplicado: ' + c.toUpperCase());
    }

    function setRole(r) {
      currentRole = r;
      showToast('Rol de usuario cambiado a: ' + r.toUpperCase());
      renderView();
    }

    function navigate(route) {
      currentPath = route;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (route === '/') document.getElementById('nav-home')?.classList.add('active');
      if (route === '/agenda') document.getElementById('nav-agenda')?.classList.add('active');
      if (route === '/mapa') document.getElementById('nav-mapa')?.classList.add('active');
      if (route === '/mis') document.getElementById('nav-mis')?.classList.add('active');
      renderView();
    }

    function toggleAttend(id) {
      if (attending.includes(id)) {
        attending = attending.filter(x => x !== id);
        const m = MEETUPS.find(x => x.id === id);
        if (m) m.current--;
        showToast('Te has desapuntado de la quedada');
      } else {
        attending.push(id);
        const m = MEETUPS.find(x => x.id === id);
        if (m) m.current++;
